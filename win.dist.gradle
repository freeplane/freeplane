import org.apache.tools.ant.taskdefs.condition.Os

import java.nio.file.Files
import java.nio.file.StandardCopyOption

String winapp_input_dir = 'BIN'

def windowsSigningEnabled = {
    Os.isFamily(Os.FAMILY_WINDOWS) && project(':freeplane').signJarProperties['signjar.cardpass']
}
def jsign = configurations.detachedConfiguration(dependencies.create('net.jsign:jsign:7.6'))
jsign.transitive = false
def signingPinVariable = 'FREEPLANE_SIGNING_PIN'
def jsignCommand = {
    def freeplane = project(':freeplane')
    def signing = freeplane.signJarProperties
    def required = ['signjar.cfg', 'signjar.certchain', 'signjar.owner', 'signjar.tsaurl']
    def missing = required.findAll { !signing[it]?.trim() }
    if (missing) {
        throw new GradleException("Missing Windows signing settings in freeplane/signjar.properties: ${missing.join(', ')}")
    }

    [
        new File(System.getProperty('java.home'), 'bin/java.exe').path, '-jar', jsign.singleFile.path,
        '--storetype', 'PKCS11',
        '--keystore', freeplane.file(signing['signjar.cfg']).path,
        '--storepass', "env:${signingPinVariable}".toString(),
        '--alias', signing['signjar.owner'],
        '--certfile', freeplane.file(signing['signjar.certchain']).path,
        '--alg', 'SHA-256', '--tsmode', 'RFC3161', '--tsaurl', signing['signjar.tsaurl'],
        '--replace'
    ]
}

def registerWindowsSigningTask = { String name, prerequisite, Closure executables ->
    tasks.register(name, Exec) {
        dependsOn prerequisite
        onlyIf { windowsSigningEnabled() && !executables().isEmpty() }
        doFirst {
            def filesToSign = executables()
            // jpackage creates its Windows launchers with the read-only attribute.
            filesToSign.each { Files.setAttribute(it.toPath(), 'dos:readonly', false) }
            environment signingPinVariable, project(':freeplane').signJarProperties['signjar.cardpass']
            commandLine jsignCommand() + filesToSign.collect { it.absolutePath }
        }
    }
}

def publishWindowsInstaller = { File installer, String releaseName ->
    def distDir = file(globalDist)
    mkdir distDir
    Files.move(installer.toPath(), new File(distDir, releaseName).toPath(), StandardCopyOption.REPLACE_EXISTING)
}

def defineWinDistTasks =  { javaRuntime, distName -> 

    def appImageDir = file("build/winapp/${javaRuntime}")
    def winapp_deleteAppImage = tasks.create("winapp_deleteAppImage_${javaRuntime}", Delete) { 
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
        delete "${appImageDir}" 
    }

    def winapp_input = tasks.create("winapp_input_${javaRuntime}", Copy) {
        onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
        
        from(winapp_input_dir) {
            include '*.jar'
        }
        
        into "${appImageDir}"

        doLast {
            mkdir "${appImageDir}/input"
        }

        dependsOn winapp_deleteAppImage

        for (p in subprojects) {
            dependsOn p.tasks.getByPath("build")
        }

    }


    def jpackage = 'jpackage'

    def jpackage_winapp = tasks.create ("jpackage_winapp_${javaRuntime}", Exec) {
        onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }

        commandLine jpackage,
                '--name' , 'freeplane',
        '--type', 'app-image',
        '--icon', 'freeplane_framework/launch4j/Freeplane_app.ico',
        '--app-version', majorVersion,
        '--java-options', "-XX:-IgnoreUnrecognizedVMOptions",
        '--java-options', "-XX:MaxRAM=20g",
        '--java-options', "-XX:MaxRAMPercentage=15.0",
        '--java-options', '-Djava.security.manager=allow',
        '--java-options', '-Djbr.java.io.use.nio=false',
        '--java-options', '-Dorg.freeplane.userfpdir=%APPDATA%\\Freeplane',
        '--java-options', '-Dorg.freeplane.windows.launcher.setDllDirectory=true',
        '--java-options', '--add-exports', 
        '--java-options', 'java.desktop/sun.awt=ALL-UNNAMED',
        '--java-options', '--add-exports', 
        '--java-options', 'java.desktop/sun.awt.shell=ALL-UNNAMED',
        '--java-options', '--add-exports', 
        '--java-options', 'java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED',
        '--java-options', '--add-exports', 
        '--java-options', 'java.desktop/sun.swing=ALL-UNNAMED',
        '--java-options', '--add-opens', 
        '--java-options', 'java.desktop/javax.swing.text.html=ALL-UNNAMED',
        '--input', "build/winapp/${javaRuntime}/input",
        '--main-class', 'org.freeplane.launcher.Launcher',
        '--main-jar', '../freeplanelauncher.jar',
        '--add-launcher', 'freeplaneConsole=freeplane_framework/launch4j/freeplaneConsole.properties',
        '--runtime-image', "java-runtime-${javaRuntime}",
        '--copyright', "Freeplane ${distVersion}",
        '--dest', "${appImageDir}"
        dependsOn winapp_deleteAppImage, winapp_input

        for (p in subprojects) {
            dependsOn p.tasks.getByPath("build")
        }
    }
    
    def winapp_makeapp = tasks.create("winapp_makeapp_${javaRuntime}", Copy) {
        onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
        dependsOn jpackage_winapp
        
        from(winapp_input_dir) {
            include '*/**'
            exclude '/*.exe'
            exclude '/*.l4j.ini'
        }
        
        into "${appImageDir}/Freeplane/"
    }


    def signWinapp = registerWindowsSigningTask("signWindowsLaunchers_${javaRuntime}", winapp_makeapp) {
        ['freeplane.exe', 'freeplaneConsole.exe'].collect { new File(appImageDir, "Freeplane/${it}") }
    }

    def installerBaseName = "Freeplane-Setup${distName}-${distVersion}"
    def windowsInstaller = tasks.register("windowsInstaller_${javaRuntime}", Exec) {
        workingDir = rootDir.path + '/freeplane_framework/windows-installer'
        dependsOn signWinapp

        doFirst {
            def compilerArgs = ["-DAppImage=${appImageDir}", "-O${temporaryDir}", "-F${installerBaseName}", '/Q']
            if (windowsSigningEnabled()) {
                // Inno Setup expands $q to a quote and $f to the quoted file name.
                def signCommand = jsignCommand().collect { '$q' + it.replace('$', '$$') + '$q' }.join(' ')
                compilerArgs += ['-DSignWithJsign', '-Sjsign=' + signCommand + ' $f']
                environment signingPinVariable, project(':freeplane').signJarProperties['signjar.cardpass']
            }
            commandLine(['ISCC.exe'] + compilerArgs + ['Freeplane.iss'])
        }
        doLast {
            def installerName = "${installerBaseName}.exe"
            publishWindowsInstaller(new File(temporaryDir, installerName), installerName)
        }
    }
    
    dist {
        dependsOn windowsInstaller
    }

}

if ( Os.isFamily(Os.FAMILY_WINDOWS)) {
    defineWinDistTasks('jbr', '')
    defineWinDistTasks('zulu', '-touchscreen')
}


def signBinLaunchers = registerWindowsSigningTask('signWindowsBinLaunchers', ':freeplane_framework:copyLauncherStuff') {
    ['freeplane.exe', 'freeplaneConsole.exe'].collect { new File(globalBin, it) }.findAll { it.isFile() }
}
signBinLaunchers.configure {
    mustRunAfter ':freeplane:build'
}
tasks.named('binZip') {
    dependsOn signBinLaunchers
}

def portableBuildDir = layout.buildDirectory.dir('windows-portable').get().asFile
def portableInstallerDir = new File(portableBuildDir, 'FreeplanePortable').path
def portableSetups = fileTree(portableBuildDir) {
    include 'FreeplanePortable_*.paf.exe'
}

task copyWindowsPortableInstallerBasicFiles(type: Copy) {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }

    // copy windows-portable files
    from(rootDir.path + '/freeplane_framework/windows-portable') {
         include('**')
    }
    into(portableInstallerDir)
}
task copyWindowsPortableInstallerLicense(type: Copy) {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }

    // copy license
    from(rootDir.path + '/freeplane/resources/') {
         include('license.txt')
         rename('license.txt', 'EULA.txt')
    }
    into(portableInstallerDir + '/Other/Source/')
}
task copyWindowsPortableInstallerIcon(type: Copy) {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }

    // copy icon
    from(rootDir.path + '/freeplane_framework/launch4j') {
        include('Freeplane_app.ico')
        rename('Freeplane_app.ico', 'appicon.ico')
    }
    into(portableInstallerDir + '/App/AppInfo/')
}


task copyWindowsPortableInstallerFiles(type: Copy) {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }

    // copy INI I
    from(rootDir.path + '/freeplane_framework/portableApps') {
        include('portable.ini')
        rename('portable.ini', 'freeplane.l4j.ini')
    }

    // copy INI II
    from(rootDir.path + '/freeplane_framework/portableApps') {
        include('portable.ini')
        rename('portable.ini', 'freeplaneConsole.l4j.ini')
    }

    // copy all other files
    from (globalBin) {
        exclude('*.bat', '*.ini', '*.sh')
    }
    into(portableInstallerDir + '/App/Freeplane/')

    for (p in subprojects) {
        dependsOn p.tasks.getByPath("build")
    }
    dependsOn signBinLaunchers
    dependsOn copyWindowsPortableInstallerBasicFiles
    dependsOn copyWindowsPortableInstallerLicense
    dependsOn copyWindowsPortableInstallerIcon
}


def signPortableLauncher = registerWindowsSigningTask('signWindowsPortableLauncher', copyWindowsPortableInstallerFiles) {
    [new File(portableInstallerDir, 'FreeplanePortable.exe')]
}

def buildWindowsPortableInstaller = tasks.register('buildWindowsPortableInstaller', Exec) {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
    ignoreExitValue = true
    workingDir = rootDir.path + '/freeplane_framework'
    commandLine 'cmd.exe', '/c', 'PortableApps.comInstaller.exe', portableInstallerDir
    dependsOn signPortableLauncher
    doFirst {
        delete portableSetups
    }
    doLast {
        def result = executionResult.get()
        if (result.exitValue == 9009) {
            logger.lifecycle('Skipping the PortableApps installer because PortableApps.comInstaller.exe was not found.')
        } else {
            result.assertNormalExitValue()
            // Require exactly one new installer before proceeding to signing.
            portableSetups.singleFile
        }
    }
}

def signPortableInstaller = registerWindowsSigningTask('signWindowsPortableInstaller', buildWindowsPortableInstaller) {
    portableSetups.files
}

task windowsPortableInstaller {
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
    dependsOn signPortableInstaller
    doLast {
        if (!portableSetups.isEmpty()) {
            publishWindowsInstaller(portableSetups.singleFile, "FreeplanePortable-${distVersion}.paf.exe")
        }
        delete portableInstallerDir
    }
}
